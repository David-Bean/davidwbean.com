<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume — David Bean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .resume-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.75rem;
    }
    .resume-actions p { flex: 1 1 14rem; }
    .resume-tabs {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .resume-tab {
      font: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.6rem 1.25rem;
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .resume-tab:hover { color: var(--text); }
    .resume-tab[aria-selected="true"] {
      background: var(--nav-bg);
      color: var(--accent);
      border-color: var(--nav-bg);
    }
    .resume-tab:focus-visible {
      outline: 2px solid var(--accent2);
      outline-offset: 2px;
    }
    @media (max-width: 480px) {
      .resume-tab { flex: 1 1 0; padding: 0.6rem 0.5rem; }
    }
    .pdf-embed {
      width: 100%;
      height: 85vh;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <nav>
    <span class="nav-name">David Bean</span>
    <ul class="nav-links">
      <li><a href="index.html">About</a></li>
      <li><a href="resume.html">Resume</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="gallery.html">Gallery</a></li>
    </ul>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  </nav>

  <div class="page-header">
    <h1>Resume</h1>
    <div class="resume-tabs" role="tablist" aria-label="Resume version">
      <button type="button" class="resume-tab" role="tab" id="tab-resume" aria-controls="panel-resume" aria-selected="true">Resume</button>
      <button type="button" class="resume-tab" role="tab" id="tab-technical" aria-controls="panel-technical" aria-selected="false" tabindex="-1">Technical</button>
    </div>
    <div class="resume-actions" style="flex-wrap: wrap;">
      <p id="resume-blurb" style="color: var(--text-muted);">A concise overview of experience and skills.</p>
      <a id="resume-download" href="resume.pdf" download class="btn-primary" style="white-space: nowrap;">Download PDF</a>
    </div>
    <noscript><p style="margin-top: 0.75rem;"><a href="technical-resume.pdf">Open the technical resume (PDF)</a></p></noscript>
  </div>

  <div class="page" style="padding-top: 0;">
    <div id="panel-resume" role="tabpanel" aria-labelledby="tab-resume">
      <iframe class="pdf-embed" src="resume.pdf" title="David Bean Resume"></iframe>
    </div>
    <div id="panel-technical" role="tabpanel" aria-labelledby="tab-technical" hidden>
      <iframe class="pdf-embed" data-src="technical-resume.pdf" title="David Bean Technical Resume"></iframe>
    </div>
  </div>

  <footer>
    <p>David Bean &mdash; davidwbean.com</p>
  </footer>

  <script src="nav.js"></script>
  <script>
    (function () {
      var TABS = {
        resume: {
          file: 'resume.pdf',
          download: '',
          blurb: 'A concise overview of experience and skills.'
        },
        technical: {
          file: 'technical-resume.pdf',
          download: 'David_Bean_Technical_Resume.pdf',
          blurb: 'The full version, with detail on each role.'
        }
      };
      var ORDER = ['resume', 'technical'];
      var link = document.getElementById('resume-download');
      var blurb = document.getElementById('resume-blurb');

      function nameFromHash() {
        var h = window.location.hash.replace('#', '').toLowerCase();
        return TABS.hasOwnProperty(h) ? h : 'resume';
      }

      function show(name) {
        ORDER.forEach(function (key) {
          var active = key === name;
          var tab = document.getElementById('tab-' + key);
          var panel = document.getElementById('panel-' + key);
          tab.setAttribute('aria-selected', active ? 'true' : 'false');
          tab.tabIndex = active ? 0 : -1;
          panel.hidden = !active;
          if (active) {
            // The hidden tab's PDF is fetched only the first time it is shown.
            var frame = panel.querySelector('iframe');
            if (frame && !frame.getAttribute('src')) {
              frame.setAttribute('src', frame.getAttribute('data-src'));
            }
          }
        });
        link.setAttribute('href', TABS[name].file);
        link.setAttribute('download', TABS[name].download);
        blurb.textContent = TABS[name].blurb;
      }

      function select(name, focus) {
        if (nameFromHash() === name) {
          show(name);
        } else {
          window.location.hash = name; // fires hashchange, which calls show()
        }
        if (focus) document.getElementById('tab-' + name).focus();
      }

      ORDER.forEach(function (key, i) {
        var tab = document.getElementById('tab-' + key);
        tab.addEventListener('click', function () { select(key, false); });
        tab.addEventListener('keydown', function (e) {
          var next = null;
          if (e.key === 'ArrowRight') next = ORDER[(i + 1) % ORDER.length];
          else if (e.key === 'ArrowLeft') next = ORDER[(i + ORDER.length - 1) % ORDER.length];
          else if (e.key === 'Home') next = ORDER[0];
          else if (e.key === 'End') next = ORDER[ORDER.length - 1];
          if (next) {
            e.preventDefault();
            select(next, true);
          }
        });
      });

      window.addEventListener('hashchange', function () { show(nameFromHash()); });
      show(nameFromHash());
    })();
  </script>
</body>
</html>
